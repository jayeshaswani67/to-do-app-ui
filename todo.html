
<!DOCTYPE html>
<html>
<head>
  <title>Spiral Todo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #e8d8c3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .notebook {
      width: 90%;
      max-width: 400px;
      background: #f5eee6;
      padding: 25px;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      position: relative;
    }

    .notebook::before {
      content: "";
      position: absolute;
      left: -15px;
      top: 60px;
      width: 10px;
      height: 10px;
      background: #c2b5a3;
      border-radius: 50%;
      box-shadow:
        0 30px #c2b5a3,
        0 60px #c2b5a3,
        0 90px #c2b5a3;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo {
      width: 35px;
      height: 45px;
      background: linear-gradient(to bottom, #4fa3ff, #1d6fe8);
      border-radius: 6px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    h1 span {
      color: orange;
    }

    .header p {
      margin: 2px 0 0;
      font-size: 12px;
      color: gray;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #f4c95d;
      outline: none;
      background: #fffaf4;
    }

    button {
      background: orange;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: darkorange;
    }

    .tasks {
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 20px;
      background: #fffaf4;
      border: 1px solid #f4c95d;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid gray;
      cursor: pointer;
    }

    .check {
      background: #2ecc71;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      border: none;
    }

    .completed {
      background: #c9f2d9;
    }

    .completed p {
      text-decoration: line-through;
      color: #555;
    }

    .delete-btn {
      background: #ff6b6b;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: #e63946;
    }
  </style>
</head>

<body>

<div class="notebook">

  <div class="header">
    <div class="logo"></div>
    <div>
      <h1>spiral<span>.</span></h1>
      <p>tear off what's done</p>
    </div>
  </div>

  <div class="input-section">
    <input type="text" id="taskInput" placeholder="e.g. water the cactus...">
    <button onclick="addTask()">Add</button>
  </div>

  <div class="tasks" id="taskList"></div>

</div>

<script>

  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function renderTasks() {
    const taskList = document.getElementById("taskList");
    taskList.innerHTML = "";

    tasks.forEach((task, index) => {
      const taskDiv = document.createElement("div");
      taskDiv.className = "task" + (task.completed ? " completed" : "");

      taskDiv.innerHTML = `
        <div class="task-left">
          <div class="circle ${task.completed ? "check" : ""}" onclick="toggleTask(${index})">
            ${task.completed ? "✓" : ""}
          </div>
          <p>${task.text}</p>
        </div>
        <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
      `;

      taskList.appendChild(taskDiv);
    });
  }

  function addTask() {
    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    if (text === "") return;

    tasks.push({ text: text, completed: false });
    input.value = "";
    saveTasks();
    renderTasks();
  }

  function toggleTask(index) {
    tasks[index].completed = !tasks[index].completed;
    saveTasks();
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    renderTasks();
  }

  renderTasks();

</script>

</body>
</html>
